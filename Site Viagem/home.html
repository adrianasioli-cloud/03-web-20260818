<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout com CSS Grid</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>



    <div class="container">
        <!-- cabeçalho --->
        <div class="grid-container">
            <div class="item">Origem</div>
            <div class="item">Destino</div>
            <div class="item">Dias</div>
            <div class="item">Preço</div>
        </div>

        <!-- Principal --->
       <div class="grid-container-foto">
            <div class="item-foto"><img src="/imagens/foto1.jpg" alt="Imagem 1"></div>
            <div class="item-foto"><img src="/imagens/foto2.jpg" alt="Imagem 2"></div>
            <div class="item-foto"><img src="/imagens/foto3.jpg" alt="Imagem 3"></div>
            <div class="item-foto"><img src="/imagens/foto4.jpg" alt="Imagem 4"></div>
        </div>

        <!-- Rodapé --->
        <div class="grid-container">
            <div class="item">Item 01</div>
            <div class="item">Item 02</div>
            <div class="item">Item 03</div>
            <div class="item">Item 04</div>
        </div>
    </div>
</body>

</html>
